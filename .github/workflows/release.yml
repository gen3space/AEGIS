name: Build & Release Binaries

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-binaries:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            os: ubuntu-latest
          - target: windows-x64
            os: windows-latest
          - target: macos-arm64
            os: macos-14

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Aegis & PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install -e . pyinstaller

      - name: Build Standalone Executable
        run: python -m PyInstaller scripts/aegis.spec --clean --noconfirm

      - name: Smoke-test Binary (`--version`)
        shell: bash
        run: |
          chmod +x dist/aegis-* 2>/dev/null || true
          ./dist/aegis-* --version

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.target }}
          path: dist/aegis-*

  publish-release:
    needs: build-binaries
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download All Platform Binaries
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate SHA256SUMS.txt
        run: |
          cd release-assets
          chmod +x aegis-linux-* aegis-macos-* 2>/dev/null || true
          sha256sum aegis-* > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish GitHub Release Assets
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release-assets/aegis-*
            release-assets/SHA256SUMS.txt
