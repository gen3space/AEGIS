<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050912" />
      <stop offset="50%" stop-color="#0a1324" />
      <stop offset="100%" stop-color="#070e1b" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="glowLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0" />
      <stop offset="50%" stop-color="#22d3ee" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0" />
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e2b42" stroke-width="0.7" stroke-opacity="0.45" />
    </pattern>
  </defs>

  <rect width="1200" height="320" rx="18" fill="url(#bgGrad)" stroke="#1e2b42" stroke-width="2" />
  <rect width="1200" height="320" rx="18" fill="url(#grid)" />

  <!-- Subtle Oscilloscope Waveforms -->
  <path d="M 0 250 Q 150 220, 300 245 T 600 225 T 900 250 T 1200 210" fill="none" stroke="#22d3ee" stroke-opacity="0.18" stroke-width="2.5" />
  <path d="M 0 268 Q 180 245, 360 260 T 720 238 T 1200 248" fill="none" stroke="#a855f7" stroke-opacity="0.16" stroke-width="2" />

  <!-- Glowing Shield Emblem -->
  <g transform="translate(86, 78)">
    <rect x="-12" y="-12" width="164" height="164" rx="34" fill="#0d182c" stroke="#22d3ee" stroke-opacity="0.45" stroke-width="1.8" />
    <path d="M70 18 L122 38 V82 C122 116 98 138 70 148 C42 138 18 116 18 82 V38 L70 18 Z" fill="#0b1f38" stroke="url(#shieldGrad)" stroke-width="4.5" stroke-linejoin="round" />
    <path d="M52 82 L65 95 L91 67" fill="none" stroke="#10b981" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Typography -->
  <text x="275" y="122" fill="#f1f5f9" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="54" font-weight="800" letter-spacing="3">AEGIS</text>
  <rect x="478" y="88" width="126" height="30" rx="15" fill="#0d2824" stroke="#10b981" stroke-width="1.2" />
  <text x="541" y="108" fill="#10b981" font-family="Consolas, JetBrains Mono, monospace" font-size="13" font-weight="700" text-anchor="middle">MIT • v1.0.0</text>

  <text x="275" y="162" fill="#94a3b8" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="21" font-weight="500">
    Two-Tier Personal &amp; Network Digital Shield — OS System Telemetry + Out-of-Band Router NGFW
  </text>

  <!-- Tier Pills -->
  <g transform="translate(275, 192)">
    <rect x="0" y="0" width="388" height="44" rx="9" fill="#0e182a" stroke="#3b82f6" stroke-opacity="0.6" stroke-width="1.3" />
    <text x="16" y="27" fill="#93c5fd" font-family="Consolas, JetBrains Mono, monospace" font-size="13.5" font-weight="700">
      TIER 1: Host System Shield (No Router Needed)
    </text>

    <rect x="406" y="0" width="458" height="44" rx="9" fill="#0b202e" stroke="#22d3ee" stroke-opacity="0.7" stroke-width="1.3" />
    <text x="422" y="27" fill="#22d3ee" font-family="Consolas, JetBrains Mono, monospace" font-size="13.5" font-weight="700">
      TIER 2: Router L7 DPI • TLS JA3 • Anti-Rootkit SOC
    </text>
  </g>

  <rect x="275" y="258" width="840" height="2" fill="url(#glowLine)" />
  <text x="275" y="284" fill="#64748b" font-family="Consolas, JetBrains Mono, monospace" font-size="12.5">
    0% Router Idle Load • 50,000+ Threat Intel IOCs • Authenticode &amp; SHA-256 • Ghost Socket Detection • Windows / Linux / macOS
  </text>
</svg>
